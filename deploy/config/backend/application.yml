server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://pet-mysql:3306/pet_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:pet}
    password: ${DB_PASSWORD:pet123}
  jackson:
    time-zone: Asia/Shanghai
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-32-byte-secret-key}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  upload:
    # 该目录在 docker-compose 中映射到宿主机，容器内统一从 /app/uploads 读取。
    base-dir: ${UPLOAD_BASE_DIR:/app/uploads}
    public-base: /uploads
  ai:
    # 与 backend 主工程保持一致，AI 相关配置直接回收到单一配置文件中。
    session-max-user-messages: ${AI_SESSION_MAX_USER_MESSAGES:5}
    provider: ${AI_PROVIDER:aiservice}
    ai-service:
      base-url: ${AI_SERVICE_BASE_URL:http://pet-aiservice:8001}
      model-name: ${AI_SERVICE_MODEL_NAME:aiservice}
